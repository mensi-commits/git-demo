<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Connexion</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Bienvenue</ion-card-title>
      <ion-card-subtitle>Connectez-vous pour continuer</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-input placeholder="Email" [(ngModel)]="email" type="email">
      </ion-input>
      <ion-input
        placeholder="Mot de passe"
        [(ngModel)]="password"
        type="password"
        class="ion-margin-top"
      >
      </ion-input>
      <ion-button
        expand="block"
        color="primary"
        (click)="login()"
        class="ion-margin-top"
      >
        Se connecter
      </ion-button>
      <ion-button
        expand="block"
        color="tertiary"
        routerLink="/register"
        class="ion-margin-top"
      >
        S'inscrire
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
