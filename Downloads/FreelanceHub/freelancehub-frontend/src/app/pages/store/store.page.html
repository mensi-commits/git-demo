<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Store – Produits Numériques</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card *ngFor="let p of products">
    <ion-card-header>
      <ion-card-title>{{ p.title }}</ion-card-title>
      <ion-card-subtitle
        >{{ p.category }} • v{{ p.version }} • {{ p.price }}
        TND</ion-card-subtitle
      >
    </ion-card-header>
    <ion-card-content>
      <p>{{ p.description }}</p>
    </ion-card-content>
    <ion-button expand="block" color="tertiary" (click)="buy(p)">
      Acheter & Télécharger maintenant
    </ion-button>
  </ion-card>
</ion-content>
